<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modif & Fusion PDF</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            background-color: #f5f5f7;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { text-align: center; font-size: 1.5rem; color: #0071e3; }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #0071e3;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-align: center;
        }
        .btn:disabled { background-color: #ccc; }
        input[type="file"] { display: none; }
        .file-label {
            display: block;
            padding: 15px;
            background: #e8e8ed;
            border: 2px dashed #86868b;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 15px;
        }
        #file-list { margin: 10px 0; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>Fusionneur de PDF</h1>
    
    <label for="pdf-inputs" class="file-label">
        Choisir des fichiers PDF (Sélectionnez-en plusieurs)
    </label>
    <input type="file" id="pdf-inputs" accept="application/pdf" multiple>
    
    <div id="file-list">Aucun fichier sélectionné</div>
    
    <button id="merge-btn" class="btn" disabled>Fusionner les PDF</button>
</div>

<script>
    const fileInput = document.getElementById('pdf-inputs');
    const fileList = document.getElementById('file-list');
    const mergeBtn = document.getElementById('merge-btn');
    let selectedFiles = [];

    fileInput.addEventListener('change', (e) => {
        selectedFiles = Array.from(e.target.files);
        if (selectedFiles.length > 0) {
            fileList.innerHTML = `<strong>Fichiers prêts :</strong><br>` + 
                selectedFiles.map(f => `📄 ${f.name}`).join('<br>');
            mergeBtn.disabled = selectedFiles.length < 2; // Requiert au moins 2 fichiers
        } else {
            fileList.innerText = "Aucun fichier sélectionné";
            mergeBtn.disabled = true;
        }
    });

    mergeBtn.addEventListener('click', async () => {
        mergeBtn.innerText = "Fusion en cours...";
        mergeBtn.disabled = true;

        try {
            // Création du nouveau document PDF
            const mergedPdf = await PDFLib.PDFDocument.create();

            for (const file of selectedFiles) {
                const fileBytes = await file.arrayBuffer();
                const pdf = await PDFLib.PDFDocument.load(fileBytes);
                // Copie de toutes les pages du PDF actuel
                const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                copiedPages.forEach((page) => mergedPdf.addPage(page));
            }

            // Sauvegarde et téléchargement du résultat
            const mergedPdfBytes = await mergedPdf.save();
            const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'fusion_resultat.pdf';
            link.click();

        } catch (error) {
            alert("Une erreur est survenue lors de la fusion : " + error.message);
        } finally {
            mergeBtn.innerText = "Fusionner les PDF";
            mergeBtn.disabled = false;
        }
    });
</script>

</body>
</html>
